packages:
  - apps/*
  - packages/*
  - e2e

# Native build scripts allowed to run on install (pnpm 10 blocks them by default).
onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma
  - esbuild
  - '@nestjs/core'
  - argon2

# Reviewed and not needed: prebuilt binaries ship via optional deps; scarf is install telemetry.
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@scarf/scarf'
  - unrs-resolver

# Security patches for transitive deps pinned by Prisma's CLI (pnpm audit in CI).
# Remove once Prisma ships the fixed versions.
overrides:
  deepmerge-ts: ^8.0.2 # GHSA-ggr8-5vv4-36mx (used by @prisma/config)
  mysql2: ^3.24.5 # GHSA-3f6p-5ww8-9rcr (unused: we run Postgres)
