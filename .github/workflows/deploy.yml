name: Deploy

# Production deploys happen only from this pipeline, after CI passes on main.
# Render's auto-deploy is off (render.yaml); Vercel deploys the web app from its Git integration.
#
# Enable by setting the repository variable DEPLOY_ENABLED=true (Settings → Secrets and variables
# → Actions → Variables) once hosting exists; until then this workflow is skipped, not failed.
#
# Required repository secrets:
#   PROD_DATABASE_URL       Neon `main` branch connection string (used for migrations)
#   RENDER_DEPLOY_HOOK_URL  Render → staffos-api → Settings → Deploy Hook
#   PROD_API_HEALTH_URL     e.g. https://staffos-api.onrender.com/api/v1/health

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-api:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Migrations run before the new code goes live and must stay backward compatible
      # with the previous release (rollback = redeploy the previous commit).
      - name: Migrate production database
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm --filter api db:migrate:deploy

      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "$HOOK"

      - name: Smoke test /health
        env:
          HEALTH_URL: ${{ secrets.PROD_API_HEALTH_URL }}
        run: |
          # Free Render instances cold-start slowly; allow up to ~10 minutes for the new build.
          for i in $(seq 1 40); do
            if curl --fail --silent "$HEALTH_URL"; then echo; echo "Healthy"; exit 0; fi
            echo "Waiting for API ($i/40)…"; sleep 15
          done
          echo "API did not become healthy" >&2
          exit 1
